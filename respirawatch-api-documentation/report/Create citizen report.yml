info:
  name: Create citizen report
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:4000/api/reports
  headers:
    - name: Content-Type
      value: application/json
    - name: x-device-hash
      value: dev-hash-warga-tebet-001
  body:
    type: json
    data: |-
      {
        "kategori": "ispa",
        "gejala": ["batuk kering", "sesak napas", "demam"],
        "jumlah_sakit": 2,
        "usia": 34,
        "tingkat_keparahan": "sedang",
        "device_hash": "dev-hash-warga-tebet-001",
        "geom": {
          "type": "Point",
          "coordinates": [106.845599, -6.208763]
        },
        "reporterName": "Warga Manggarai",
        "description": "Asap pembakaran sampah menyebabkan 2 anggota keluarga batuk dan sesak."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
