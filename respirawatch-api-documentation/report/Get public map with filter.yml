info:
  name: Get public map with filter
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:4000/api/map?category=ispa&severity=sedang
  params:
    - name: category
      value: ispa
      type: query
    - name: severity
      value: sedang
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
